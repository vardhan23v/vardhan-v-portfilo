name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · build · test · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # PUPPETEER_SKIP_DOWNLOAD is deliberately unset so Puppeteer's postinstall fetches Chrome.
      - run: npm ci

      - name: Ensure Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - run: npm test -- --run
      - run: npm run smoke

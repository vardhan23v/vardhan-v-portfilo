    <script>
      // Motion preference before first paint: localStorage "motion" = off | auto (follow the OS) | (unset = on).
      (function () {
        try {
          var p = localStorage.getItem("motion");
          var os = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          document.documentElement.setAttribute("data-motion", p === "off" || (p === "auto" && os) ? "reduce" : "on");
        } catch (e) { document.documentElement.setAttribute("data-motion", "on"); }
      })();
    </script>
